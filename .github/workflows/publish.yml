name: Publish to npm

on:
  workflow_dispatch:
    inputs:
      version_type:
        description: "Version bump type"
        required: true
        type: choice
        options:
          - patch
          - minor
          - major
          - beta
        default: patch

permissions:
  contents: write
  id-token: write

concurrency:
  group: publish-npm
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v4

      - name: Stable releases only from main or master
        run: |
          if [ "${{ inputs.version_type }}" != "beta" ] && [ "${{ github.ref_name }}" != "main" ] && [ "${{ github.ref_name }}" != "master" ]; then
            echo "::error::Stable releases (${{ inputs.version_type }}) must be published from 'main' or 'master', not '${{ github.ref_name }}'. Use 'beta' for prereleases from other branches."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - run: npm ci

      - run: npm run check

      - name: Bump version
        run: |
          if [ "${{ inputs.version_type }}" = "beta" ]; then
            SLUG=$(printf '%s' "${{ github.ref_name }}" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9-]/-/g; s/-\+/-/g; s/^-//; s/-$//' | cut -c1-20)
            [ -n "$SLUG" ] || SLUG=branch
            npm version prerelease --preid="beta-${SLUG}" --no-git-tag-version
          else
            npm version "${{ inputs.version_type }}" --no-git-tag-version
          fi

      - run: npm run build

      - name: Publish to npm
        run: |
          if [ "${{ inputs.version_type }}" = "beta" ]; then
            npm publish --provenance --tag beta
          else
            npm publish --provenance --tag latest
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Commit version bump to the branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          VERSION=$(node -p "require('./package.json').version")
          git commit -m "chore: release v${VERSION}"
          git tag "v${VERSION}"
          git push origin "HEAD:${{ github.ref_name }}" --tags
